<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080C18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Navale" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Navale</title>
    <meta
      name="description"
      content="Bataille navale de 2 à 4 joueurs. L'écran central affiche les grilles, chacun joue sur son téléphone."
    />
    <!-- Pas d'indexation (doublée par l'en-tête X-Robots-Tag du serveur). -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Aperçu de lien (Open Graph, repris par X, WhatsApp, Messenger, Slack, Discord…).
      __PUBLIC_URL__ est remplacé par le serveur au démarrage : l'image exige une URL
      absolue. Pas d'og:url : un lien de partie (/play/KRTX) doit ouvrir la partie, pas l'accueil.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Navale" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Navale, bataille navale autour de la table" />
    <meta
      property="og:description"
      content="L'écran central affiche les grilles, chacun joue sur son téléphone. De 2 à 4 joueurs, sans appli à installer."
    />
    <meta property="og:image" content="__PUBLIC_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Les grilles de trois joueurs sur l'écran central, et le téléphone d'un joueur avec ses bateaux."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
