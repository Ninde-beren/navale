# Navale en production : un conteneur, un volume pour SQLite, et le réseau Docker
# externe `web` du Caddy partagé (infra-docker), qui le joint par son nom : navale:5251.
#   docker network create web   # une fois, si le réseau n'existe pas encore (poste de dev)
#   cp .env.example .env         # PUBLIC_URL obligatoire
#   docker compose up -d --build
name: navale
services:
  navale:
    build:
      context: .
      args:
        NAVALE_VERSION: ${NAVALE_VERSION:-dev}
    image: navale:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?définir PUBLIC_URL (ex. https://navale.sigilbo.fr) dans .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Espace d'administration /admin (Basic Auth) ; fermé tant que le mot de passe est vide.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Retours du bouton « Un avis ? » par mail ; sans transport, ils restent lisibles dans /admin.
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Navale}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
    ports:
      # Lié à l'interface locale, pour un reverse proxy hors Docker ou un contrôle à la main.
      - '${BIND:-127.0.0.1}:${NAVALE_PORT:-5251}:5251'
    volumes:
      # Le journal SQLite survit à `docker compose down`. Le conteneur écrit avec l'uid 1000.
      - ./data:/data
    networks:
      - web

networks:
  web:
    external: true
    name: ${WEB_NETWORK:-web}
